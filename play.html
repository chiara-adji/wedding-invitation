<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56603F">
<title>Chiara &amp; Adji · Mini Game</title>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital@0;1&family=Pinyon+Script&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one centered column — game cabinet (6:5 canvas) framed like a pixel card, control pad below. Single light look taken from the invitation site. */
:root{
  --ivory:#F5EFE3; --paper:#FBF8F0; --linen:#E9E0CD; --mist:#CBD1BC;
  --sage:#8B9871; --moss:#4D5838; --forest:#3A4430; --ink:#2D2A24; --claret:#702B32;
  --f-pixel:"Pixelify Sans","Courier New",monospace;
  --f-disp:"Cormorant Garamond",Georgia,serif;
  --f-body:"EB Garamond",Georgia,serif;
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  color-scheme:light;
}
html,body{background:var(--ivory);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-pixel);font-size:13px;color:var(--moss)}
.topbar b{font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lang{display:flex;border:2px solid var(--forest);box-shadow:2px 2px 0 var(--sage)}
.lang button{font:600 12px var(--f-pixel);padding:5px 10px;border:0;background:var(--paper);color:var(--forest);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--forest);color:var(--paper)}
.frame{position:relative;width:100%;aspect-ratio:6/5;max-width:100%;border:4px solid var(--forest);box-shadow:6px 6px 0 var(--sage);background:var(--forest);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5%;gap:10px}
.ov[hidden]{display:none!important}
.frame.menu{aspect-ratio:auto}
.frame.menu canvas{display:none}
.frame.menu .ov{position:static;padding:28px 16px;min-height:340px}
#landing{background:var(--paper);background-image:radial-gradient(var(--linen) 1px,transparent 1px);background-size:10px 10px}
.kicker{font:600 11px var(--f-pixel);letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
.names{font-family:var(--f-script);font-size:clamp(38px,10vw,62px);line-height:1;color:var(--forest)}
.date{font-family:var(--f-disp);font-style:italic;font-size:clamp(16px,3.6vw,20px);color:var(--ink-soft,#463F33)}
.q{font-family:var(--f-disp);font-style:italic;font-weight:500;font-size:clamp(14px,3vw,16px);letter-spacing:.02em;line-height:1.45;color:var(--moss);max-width:32ch;text-wrap:balance;margin-top:2px}
.duo{display:flex;align-items:flex-end;gap:6px;height:22%;}
.duo img{height:100%;image-rendering:pixelated}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pbtn{font:600 15px var(--f-pixel);line-height:1.2;letter-spacing:.03em;padding:11px 16px;min-height:46px;border:3px solid var(--forest);background:var(--forest);color:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pbtn.alt{background:var(--paper);color:var(--forest);box-shadow:0 4px 0 var(--sage)}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pbtn:focus-visible,.card:focus-visible,.cbtn:focus-visible,.lang button:focus-visible,.skip:focus-visible{outline:3px solid var(--claret);outline-offset:2px}
#select{background:var(--ivory)}
#select h2{font:600 clamp(18px,4.4vw,24px) var(--f-pixel);color:var(--forest);margin:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
.card{position:relative;border:3px solid var(--forest);background:var(--paper);box-shadow:4px 4px 0 var(--sage);padding:10px 8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-pixel);color:var(--ink)}
.card:hover{background:#fff}
.card img{height:clamp(70px,22vw,120px);image-rendering:pixelated}
.card .nm{font-weight:700;font-size:17px;color:var(--forest)}
.card .rt{font-size:11px;color:var(--moss);line-height:1.35;min-height:2.7em}
.card .done{position:absolute;top:6px;right:6px;font-size:10px;background:var(--claret);color:var(--paper);padding:2px 5px}
#finale{justify-content:flex-end;padding-bottom:5%;gap:8px;pointer-events:none}
#finale>*{pointer-events:auto}
.see{font:700 clamp(20px,5.4vw,30px) var(--f-pixel);color:var(--forest);line-height:1.1}
.see small{display:block;font-size:.62em;color:var(--claret);letter-spacing:.12em;margin-top:4px}
.both{font-family:var(--f-body);font-style:italic;font-size:14px;max-width:34ch;color:var(--ink)}
.skip{position:absolute;bottom:8px;right:8px;font:600 12px var(--f-pixel);background:rgba(251,248,240,.9);color:var(--forest);border:2px solid var(--forest);padding:4px 8px;cursor:pointer}
.ctrl{display:flex;gap:12px;justify-content:center;min-height:62px}
.cbtn{font:700 18px var(--f-pixel);min-width:96px;min-height:58px;padding:0 18px;border:3px solid var(--forest);background:var(--paper);color:var(--forest);box-shadow:0 5px 0 var(--forest);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cbtn.main{background:var(--claret);border-color:var(--ink);color:var(--paper);box-shadow:0 5px 0 var(--ink);min-width:180px}
.cbtn:active,.cbtn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--forest)}
.note{font-size:14px;color:var(--moss);text-align:center;font-style:italic}
@media (max-width:420px){.card .rt{font-size:10px}.pbtn{font-size:14px;padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <span><b>Chiara &amp; Adji</b> · mini game</span>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-id" aria-pressed="true">ID</button>
      <button id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="frame menu" id="frame">
    <canvas id="cv" width="480" height="400" aria-label="Game"></canvas>

    <div class="ov" id="landing">
      <div class="kicker" data-t="wedOf"></div>
      <div class="names">Chiara &amp; Adji</div>
      <div class="date" data-t="date"></div>
      <div class="duo"><img id="duo-c" alt="Chiara"><img id="duo-a" alt="Adji"></div>
      <div class="q" data-t="ask"></div>
      <div class="btns">
        <button class="pbtn" id="btn-play" data-t="play"></button>
        <a class="pbtn alt" id="btn-inv" href="./" data-t="toInv"></a>
      </div>
    </div>

    <div class="ov" id="select" hidden>
      <div class="kicker" data-t="selKick"></div>
      <h2 data-t="selTitle"></h2>
      <div class="cards">
        <button class="card" id="pick-chiara"><span class="done" hidden data-t="played"></span><img id="sel-c" alt=""><span class="nm">Chiara</span><span class="rt" data-t="routeC"></span></button>
        <button class="card" id="pick-adji"><span class="done" hidden data-t="played"></span><img id="sel-a" alt=""><span class="nm">Adji</span><span class="rt" data-t="routeA"></span></button>
      </div>
      <a class="pbtn alt" href="./" data-t="toInv"></a>
    </div>

    <div class="ov" id="finale" hidden>
      <div class="see">See you on Cepu<small>19 · 12 · 2026</small></div>
      <div class="both" id="both" hidden data-t="both"></div>
      <div class="btns">
        <button class="pbtn alt" id="btn-other"></button>
        <a class="pbtn" href="./" data-t="toInv"></a>
      </div>
    </div>

    <button class="skip" id="skip" hidden data-t="skip"></button>
  </div>

  <div class="ctrl" id="ctrl"></div>
</div>

}
function loadAll() {

const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function heart(x, y, s, col = C.claret) {
  for (let r = 0; r < HEART.length; r++) for (let c = 0; c < 7; c++)
    if (HEART[r][c] === 'X') R(x + (c - 3.5) * s, y + r * s, s, s, col);
}
let particles = [];
function addHearts(x, y, n = 1) {
  for (let i = 0; i < n; i++) particles.push({ x: x + (Math.random() - .5) * 30, y, vy: -30 - Math.random() * 30, life: 1.6 + Math.random(), s: Math.random() < .3 ? 3 : 2 });
}
function stepParticles(dt) {

  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { ctx.globalAlpha = Math.min(1, p.life); heart(p.x, p.y, p.s, p.s === 3 ? C.claret : '#B2545E'); ctx.globalAlpha = 1; });
}

// ---------- backgrounds ----------
function sky(top, bottom) {
  const bands = [C.sky1, C.sky1, C.sky2, C.sky2, C.sky3];
  const bh = (bottom - top) / bands.length;
  bands.forEach((c, i) => R(0, top + i * bh, W, bh + 1, c));
  // sun
  const sx = 380, sy = 78;
  for (let dy = -16; dy <= 16; dy += 4) { const w = Math.round(Math.sqrt(256 - dy * dy) / 4) * 4; R(sx - w, sy + dy, w * 2, 4, C.sun); }
  // pixel clouds
  const cl = (x, y) => { R(x, y, 36, 6, C.paper); R(x + 6, y - 6, 18, 6, C.paper); R(x + 26, y - 3, 12, 3, C.paper); };
  const off = (performance.now() / 120) % (W + 80);
  cl((60 - off + W + 80) % (W + 80) - 40, 40); cl((260 - off * .7 + W + 80) % (W + 80) - 40, 64);
}
function hills(scroll, base, col, amp, k) {
  ctx.fillStyle = col;
  for (let x = 0; x < W; x += 4) {
    const u = x + scroll * k;
    const h = Math.round((amp + amp * .6 * Math.sin(u / 47) + amp * .4 * Math.sin(u / 19)) / 2) * 2;
    ctx.fillRect(x, base - h, 4, h);
  }
}
function refinery(scroll, base, k) {
  // Balikpapan coastline: storage tanks + flare stack, repeating
  const period = 210, off = (scroll * k) % period;
  for (let px = -off - period; px < W + period; px += period) {
    R(px + 10, base - 16, 26, 16, C.city); R(px + 12, base - 18, 22, 2, C.city);
    R(px + 42, base - 12, 20, 12, C.city);
    R(px + 76, base - 44, 5, 44, C.city); R(px + 75, base - 50, 7, 3, C.city);
    const f = Math.floor(performance.now() / 160) % 2;
    R(px + 76, base - 56 - f * 2, 5, 6 + f * 2, '#E8A24E'); R(px + 77, base - 53, 3, 3, C.sun);
    R(px + 100, base - 22, 40, 22, C.city); R(px + 104, base - 30, 6, 8, C.city); R(px + 120, base - 26, 4, 4, C.city);
  }
}
function sea(top, scroll) {
  const bands = [C.sea1, C.sea2, C.sea3, C.sea4];
  const bh = (H - top) / bands.length;
  bands.forEach((c, i) => R(0, top + i * bh, W, bh + 1, c));
  const tt = performance.now() / 1000;
  for (let y = top + 8, row = 0; y < H; y += 14, row++) {
    const sp = .4 + row * .12, len = 6 + row * 2, gap = 46 + (row % 3) * 18;
    const off = ((scroll * sp + tt * 8 + row * 31) % gap + gap) % gap;
    for (let x = -off; x < W; x += gap) R(x, y, len, 2, row < 4 ? '#8FBABB' : '#5E95A0');
  }
}
function bayScene(scroll) {
  sky(0, 150);
  hills(scroll, 150, C.hill, 26, .08);
  refinery(scroll, 150, .18);
  hills(scroll + 900, 152, C.hill2, 10, .25);

}

// ---------- scene system ----------
let scene = null, last = 0;
const done = { chiara: false, adji: false };
function go(s) {
  scene = s; particles = []; $('frame').classList.remove('menu');
  ['landing', 'select', 'finale'].forEach(id => $(id).hidden = true);
  $('skip').hidden = !s.skippable;
  if (s.enter) s.enter();
  setControls(s.controls || 'none');
}
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (scene) { scene.update && scene.update(dt); ctx.clearRect(0, 0, W, H); scene.draw(); stepParticles(dt); }
  requestAnimationFrame(loop);
}

// controls
function setControls(mode) {
  const el = $('ctrl'); el.innerHTML = '';
  const mk = (label, act, cls = '') => {
    const b = document.createElement('button'); b.className = 'cbtn ' + cls; b.textContent = label;
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); input(act); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('on')));
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input(act); } });
    el.appendChild(b);
  };
  if (mode === 'lanes') { mk(t('up'), 'up'); mk(t('down'), 'down'); }
  else if (mode === 'go') mk(t('go'), 'tap', 'main');
  else if (mode === 'jump') mk(t('jump'), 'tap', 'main');
  else if (mode === 'finale') {
    const other = scene.who === 'chiara' ? 'adji' : 'chiara';
    const b = document.createElement('button'); b.className = 'pbtn alt';
    if (done.chiara && done.adji) { b.textContent = t('again'); b.onclick = showSelect; }
    else { b.textContent = other === 'adji' ? t('tryA') : t('tryC'); b.onclick = () => start(other); }
    const a = document.createElement('a'); a.className = 'pbtn'; a.textContent = t('toInv');
    a.href = './';
    el.append(b, a);
  }
}
function input(a) { if (scene && scene.input) scene.input(a); }
cv.addEventListener('pointerdown', e => {
  if (!scene) return;
  const r = cv.getBoundingClientRect(); const y = (e.clientY - r.top) / r.height * H;
  if (scene.controls === 'lanes') input(y < scene.midY ? 'up' : 'down'); else input('tap');
});
window.addEventListener('keydown', e => {
  if (!scene || !scene.input) return;
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { input('up'); e.preventDefault(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { input('down'); e.preventDefault(); }
  else if ((k === ' ' || k === 'Enter') && document.activeElement === document.body) { input('tap'); e.preventDefault(); }
});

// ---------- boat scene (Chiara speed boat / Adji klotok) ----------
const LANES = [222, 286, 350];
let KX = 40, KY = -20;
function BoatScene(o) {
  // o: {who, vehicle, length, speed, from, to, hitKey, types, next, ending}
  const s = {
    controls: 'lanes', skippable: true, midY: 0,
    dist: 0, scroll: o.scrollStart || 0, lane: 1, y: LANES[1], x: o.vehicle === 'klotok' ? 130 : 120,
    obs: [], nextSpawn: 340, inv: 0, slow: 0, say: null, sayT: 0, phase: 'run', dockX: W + 60, endT: 0, time: 0,
    lives: o.lives || 0, failT: 0
  };
  const halfW = o.vehicle === 'klotok' ? 66 : 54;
  s.enter = () => { s.say = o.startLine ? t(o.startLine) : null; s.sayT = o.startLine ? 2 : 0; };
  s.skip = () => o.onSkip();
  s.input = a => {
    if (s.phase !== 'run') return;
    if (a === 'up') s.lane = Math.max(0, s.lane - 1);
    if (a === 'down') s.lane = Math.min(2, s.lane + 1);
  };
  function spawn() {
    const late = s.dist > o.length * .45;
    const types = o.types.filter(ty => ty !== 'barge' || late);
    const ty = types[Math.floor(Math.random() * types.length)];
    const lanes = [0, 1, 2].sort(() => Math.random() - .5);
    const dbl = o.double || [0, .45];
    const n = Math.random() < (late ? dbl[1] : dbl[0]) ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const tt = i === 0 ? ty : (Math.random() < .5 ? 'wave' : 'buoy');
      s.obs.push({ type: tt, lane: lanes[i], x: W + 70 + i * 50 });
    }
    s.nextSpawn = s.dist + (o.gap[0] + Math.random() * (o.gap[1] - o.gap[0])) * (late ? .85 : 1);
  }
  s.update = dt => {
    s.time += dt;
    s.midY = s.y;
    let sp = o.speed * (s.slow > 0 ? .45 : 1);
    if (s.phase === 'fail') { s.failT += dt; s.sayT = 0; if (s.failT > 2.4) go(o.restart()); return; }
    if (s.phase === 'arrive') {
      s.lane = 1;
      const target = 262, before = s.dockX;
      s.dockX += (target - s.dockX) * Math.min(1, dt * 1.8);
      if (s.dockX - target < 1.5) s.dockX = target;
      sp = (before - s.dockX) / Math.max(dt, 1e-4);
      if (s.dockX === target) { s.endT += dt; if (s.endT > .4) go(o.ending(s)); }
    }
    const dx = sp * dt;
    s.dist += dx; s.scroll += dx;
    s.obs.forEach(ob => ob.x -= dx);
    s.obs = s.obs.filter(ob => ob.x > -100);
    if (s.phase === 'run') {
      if (s.dist >= s.nextSpawn && s.dist < o.length - 380) spawn();
      if (s.dist >= o.length) { s.phase = 'arrive'; if (o.arriveLine) { s.say = t(o.arriveLine); s.sayT = 2.2; s.sayWho = 'other'; } }
    }
    s.y += (LANES[s.lane] - s.y) * Math.min(1, dt * 12);
    s.inv = Math.max(0, s.inv - dt); s.slow = Math.max(0, s.slow - dt); s.sayT = Math.max(0, s.sayT - dt);
    const near = LANES.reduce((bi, ly, i) => Math.abs(ly - s.y) < Math.abs(LANES[bi] - s.y) ? i : bi, 0);
    if (s.inv <= 0) for (const ob of s.obs) {
      if (ob.lane === near && Math.abs(ob.x - s.x) < OB[ob.type].w / 2 + halfW - 10) {
        s.inv = 1.4; s.slow = .9; s.say = pick(o.hitKey); s.sayT = 1.2; s.sayWho = 'me';
        if (s.lives) { s.lives--; s.lostT = .6; if (s.lives === 0) { s.phase = 'fail'; s.failT = 0; } }
        break;
      }
    }
  };
  s.drawPlayer = () => {
    const blink = s.inv > 0 && Math.floor(s.inv * 10) % 2 === 0;
    const bob = Math.round(Math.sin(s.time * (o.vehicle === 'klotok' ? 3 : 6)) * 1.5);
    const y = Math.round(s.y) + bob;
    ctx.globalAlpha = blink ? .35 : 1;
    if (o.vehicle === 'speedboat') {
      spr(IMG.chiara_right, s.x - 30, y - 16);
      spr(IMG.speedboat, s.x, y + 10);
      // wake
      if (s.phase === 'run') for (let i = 0; i < 3; i++) R(s.x - 80 - i * 14 - (s.time * 60 % 14), y + 2 + (i % 2) * 3, 10, 2, C.foam);
    } else {
      spr(IMG.klotok, s.x, y + 14);
      spr(IMG.adji_right, s.x + KX - 6, y + KY - 18);
      spr(IMG.scooter, s.x + KX, y + KY);
      R(s.x + 84, y - 4, 4, 2, C.foam);
    }
    ctx.globalAlpha = 1;
    return y;
  };
  s.drawDock = () => {
    if (s.phase !== 'arrive' && s.dockX >= W + 50) return;
    const dx = Math.round(s.dockX), top = LANES[1] - 14;
    for (let x = dx + 6; x < W; x += 34) { R(x, top, 8, H - top, C.woodD); R(x, top + 30, 8, 3, C.sea4); }
    R(dx, top - 8, W - dx, 10, C.wood); R(dx, top - 8, W - dx, 2, C.woodL);
    for (let x = dx; x < W; x += 12) R(x, top - 8, 1, 10, C.woodD);
    R(dx + 2, top - 26, 4, 18, C.woodD); R(dx + 2, top - 28, 4, 2, C.woodL);
    // Adji waiting on the dock
    if (o.who === 'chiara') {
      const wave = Math.floor(s.time * 3) % 2;
      spr(IMG.adji_left || IMG.adji_front, dx + 140, top - 8 - wave);
    }
  };
  s.draw = () => {
    bayScene(s.scroll);
    const items = s.obs.map(ob => ({ y: LANES[ob.lane], f: () => OB[ob.type].draw(Math.round(ob.x), LANES[ob.lane]) }));
