    <p class="gate-t" id="gate-t"></p>
    <p class="gate-s" id="gate-s"></p>
    <div class="gate-btns">
      <button class="btn" type="button" id="gate-play"></button>
      <button class="btn ghost" type="button" id="gate-skip"></button>
    </div>

  </div>

<script>
(function () {
  var gate = document.getElementById('gate'); if (!gate) return;
  var T = {
    id: { k: 'Sebelum dibuka', t: 'Mau main mini game dulu?', s: 'Kami membuat game kecil tentang perjalanan kami saling menjemput.', p: '▶︎ Main mini game', g: 'Langsung ke undangan', m: '± 1 menit · nyalakan suara' },
    en: { k: 'Before you open it', t: 'Play a little game first?', s: 'We made a tiny game about how we always find our way to each other.', p: '▶︎ Play the mini game', g: 'Go to the invitation', m: 'About 1 minute · sound on' }
  };
  var pass = false;
  try { pass = sessionStorage.getItem('ca-played') === '1'; } catch (e) {}
  function lang() {
    var b = document.querySelector('#lang-open [aria-pressed="true"]');
    var v = b ? b.textContent.trim().toLowerCase() : (document.documentElement.lang || 'en');
    return v.indexOf('id') === 0 ? 'id' : 'en';
  }
  function open() {
    var x = T[lang()];
    ['k', 't', 's', 'm'].forEach(function (k) { document.getElementById('gate-' + k).textContent = x[k]; });
    document.getElementById('gate-play').textContent = x.p;
    document.getElementById('gate-skip').textContent = x.g;
    gate.hidden = false;
    requestAnimationFrame(function () { gate.classList.add('in'); });
    document.getElementById('gate-play').focus();
  }
  window.addEventListener('click', function (e) {
    if (pass || !e.target.closest || !e.target.closest('#seal')) return;
    e.preventDefault(); e.stopImmediatePropagation(); open();
  }, true);
  document.getElementById('gate-play').onclick = function () {
    try { sessionStorage.setItem('ca-gate', '1'); sessionStorage.setItem('ca-played', '1'); } catch (e) {}
    location.href = 'play.html' + location.search;
  };
  document.getElementById('gate-skip').onclick = function () {
    pass = true; gate.classList.remove('in');
    setTimeout(function () { gate.hidden = true; document.getElementById('seal').click(); }, 250);
  };
  gate.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('gate-skip').click(); });
})();
</script>
